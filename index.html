<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점심 뭐 먹지?</title>
<style>
  :root{--bg:#f6f4ef;--ink:#1f1b16;--muted:#8a8175;--line:#e6e0d6;--card:#fff;--accent:#ff6b35}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:flex;height:100vh}
  #map{flex:1;position:relative;background:#e9e5dd}
  .map-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px;line-height:1.7}
  aside{width:400px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg);min-height:0}
  header{padding:16px 16px 12px;border-bottom:1px solid var(--line);background:#fff}
  h1{margin:0;font-size:20px;letter-spacing:-.3px}
  h1 b{color:var(--accent)}
  .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
  select,input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
  .btn{font:inherit;font-size:13px;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;background:var(--ink);color:#fff}
  .btn.ghost{background:#f1ede6;color:var(--ink)}
  .btn.accent{background:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  label.ck{display:inline-flex;gap:4px;align-items:center;cursor:pointer;color:#4a443c}
  .spacer{flex:1}
  .tabs{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap}
  .tab{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
  .tab .dot{width:9px;height:9px;border-radius:50%}
  .tab small{color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab.on small{color:#ddd}
  .count{font-size:12px;color:var(--muted);padding:8px 16px 0}
  .list{flex:1;overflow:auto;padding:8px 12px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
  .card:hover{border-color:#cfc6b8}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px #ff6b3533}
  .card.hiddenp{opacity:.45}
  .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .name{font-weight:700;font-size:15px}
  .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .dist{font-size:12px;color:var(--muted);white-space:nowrap}
  .gtag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff;margin-right:5px;vertical-align:1px}
  .row{display:flex;gap:6px;margin-top:9px;align-items:center}
  .link{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--ink);text-decoration:none}
  .link.k{background:#fee500;border-color:#fee500;color:#191600;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.8;font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;z-index:60}
  .toast.on{opacity:1}
  .company-pin{background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;box-shadow:0 2px 6px #0004;white-space:nowrap}
  .pin{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px #0006;cursor:pointer;transition:transform .12s}
  .pin:hover,.pin.sel{transform:scale(1.45)}
  .iwbox{background:#fff;border-radius:10px;box-shadow:0 3px 12px #0003;padding:9px 12px;font-size:13px;line-height:1.5;min-width:150px;transform:translateY(-14px)}
  .iwbox b{font-size:14px}
  .home-btn{position:absolute;left:12px;top:12px;z-index:10;box-shadow:0 2px 6px #0003}
  .pickbox{background:#fff;border:2px solid var(--accent);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .pickhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff4ee;cursor:pointer}
  .pickhead .t{font-size:12px;color:var(--accent);font-weight:700}
  .pickhead .n{font-size:16px;font-weight:800}
  .ptabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ptab{flex:1;font:inherit;font-size:14px;font-weight:600;padding:10px 0;border:0;background:#fff;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
  .ptab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .pickframe{width:100%;height:560px;border:0;display:block;background:#f6f4ef}
  .pickfoot{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}

  /* ───── 채팅 ───── */
  .chat-fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 18px #ff6b3566, 0 2px 6px #0003;display:flex;align-items:center;justify-content:center;z-index:40;transition:transform .15s}
  .chat-fab:hover{transform:scale(1.06)}
  .chat-fab svg{width:28px;height:28px}
  .chat-badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:#e03131;color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px;border:2px solid #fff}
  .chat-panel{position:fixed;right:22px;bottom:94px;width:360px;height:520px;max-height:calc(100vh - 120px);background:#fff;border-radius:16px;box-shadow:0 12px 40px #0003, 0 2px 8px #0002;display:none;flex-direction:column;overflow:hidden;z-index:41}
  .chat-panel.on{display:flex}
  .chat-head{padding:12px 14px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px}
  .chat-head b{font-size:15px}
  .chat-head small{color:#cfc8bf;font-size:12px}
  .chat-head button{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1}
  .chat-msgs{flex:1;overflow:auto;padding:12px;background:#f6f4ef;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:2px;align-self:flex-start;align-items:flex-start}
  .msg .who{font-size:12px;font-weight:700;color:#5c554b;padding:0 4px}
  .msg.me .who{color:var(--accent)}
  .msg .bubble{background:#fff;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:14px;line-height:1.45;word-break:break-word;box-shadow:0 1px 2px #0001}
  .msg .time{font-size:10px;color:#a8a097;padding:0 4px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.me .bubble{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px}
  .msg .bubble a{color:inherit;font-weight:700}
  .msg .share{display:block;margin-top:4px;font-size:12px;text-decoration:underline;cursor:pointer}
  .chat-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
  .chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
  .chat-form input{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:20px;padding:9px 14px}
  .chat-form button{border:0;border-radius:20px;background:var(--accent);color:#fff;font:inherit;font-size:14px;padding:0 16px;cursor:pointer}
  .chat-setup{padding:24px 18px;font-size:13px;line-height:1.7;color:#4a443c}
  .chat-head .back{margin-left:0;font-size:22px;padding:0 4px 0 0}
  .chat-head .plus{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--accent);font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
  .chat-head .plus + button{margin-left:6px}
  .rooms{flex:1;overflow:auto;background:#fff}
  .room{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #f1ede6;cursor:pointer}
  .room:hover{background:#faf8f4}
  .room .av{width:40px;height:40px;border-radius:12px;background:#fff0e8;color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .room .rb{flex:1;min-width:0}
  .room .rn{font-weight:700;font-size:14px}
  .room .rl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .room .rt{font-size:11px;color:#a8a097;white-space:nowrap;align-self:flex-start;margin-top:2px}
  .room .dot{width:8px;height:8px;border-radius:50%;background:#e03131;flex:none}
  .newroom{display:flex;gap:6px;padding:10px 12px;background:#fff4ee;border-bottom:1px solid var(--line)}
  .newroom input{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .rooms-empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:60px 20px}
  .chat-form .emoji-btn{border:0;background:transparent;font-size:22px;cursor:pointer;padding:0 2px;line-height:1;border-radius:8px}
  .emoji-pop{display:none;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;border-top:1px solid var(--line);background:#fff;max-height:150px;overflow:auto}
  .emoji-pop.on{display:grid}
  .emoji-pop button{border:0;background:transparent;font-size:22px;cursor:pointer;border-radius:8px;padding:4px 0}
  .emoji-pop button:hover{background:#f1ede6}
  .room .del{border:0;background:#fff0f0;color:#e03131;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;flex:none}
  .admin-bar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#fff0f0;color:#c92a2a;font-size:12px;font-weight:700;border-bottom:1px solid #ffd8d8}
  .admin-bar button{margin-left:auto;border:0;background:transparent;color:#c92a2a;text-decoration:underline;cursor:pointer;font:inherit;font-size:12px}
  .rooms-note{font-size:11px;color:#a8a097;text-align:center;padding:10px}

  /* ───── 같이 가요 / 평가 / 투표 ───── */
  .gather{background:#fff;border:2px solid #4c6ef5;border-radius:14px;margin-bottom:10px;overflow:hidden}
  .gather-h{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#edf2ff;color:#364fc7;font-weight:800;font-size:13px}
  .gather-h small{font-weight:600;color:#5c7cfa;margin-left:auto;font-size:11px}
  .gitem{padding:10px 12px;border-top:1px solid #e7ecff}
  .gitem .gt{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
  .gitem .gtime{font-size:12px;font-weight:800;color:#fff;background:#4c6ef5;border-radius:6px;padding:1px 7px}
  .gitem .gm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .gitem .gb{display:flex;gap:6px;margin-top:7px}
  .gitem .join{background:#4c6ef5;color:#fff;border-color:#4c6ef5;font-weight:700}
  .gitem .join.in{background:#fff;color:#4c6ef5}
  .gitem .gb{flex-wrap:wrap}
  .gitem .room-btn{background:#ff6b35;color:#fff;border-color:#ff6b35;font-weight:700}
  .gitem.hl{background:#fff9db;animation:hlfade 3s ease-out}
  @keyframes hlfade{from{box-shadow:inset 0 0 0 3px #fab005}to{box-shadow:inset 0 0 0 0 #fab005}}
  body.dinner .gitem.hl{background:#3d3410}
  .actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .actions .link{padding:4px 8px}
  .actions .link.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions .link.up.on{background:#2b8a3e;border-color:#2b8a3e}
  .actions .link.down.on{background:#c92a2a;border-color:#c92a2a}
  .actions .link.ok.on{background:#e67700;border-color:#e67700}
  .gform{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:13px}
  .gform select{padding:5px 8px}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tagx{font-size:11px;border-radius:6px;padding:2px 7px;background:#f1ede6;color:#5c554b;font-weight:600}
  .tagx.ok{background:#fff3bf;color:#a15c00}
  .tagx.vis{background:#e7f5ff;color:#1864ab}
  .tagx.gath{background:#edf2ff;color:#364fc7}
  .walk{font-weight:700;color:var(--ink)}
  .poll{min-width:210px}
  .poll .pq{font-weight:800;margin-bottom:6px}
  .poll .pq small{font-weight:600;opacity:.8;margin-left:4px}
  .popt{display:block;width:100%;text-align:left;border:1px solid #0001;background:#0000000a;border-radius:9px;padding:6px 8px;margin-top:5px;cursor:pointer;font:inherit;font-size:13px;color:inherit;position:relative;overflow:hidden}
  .popt .bar{position:absolute;left:0;top:0;bottom:0;background:#ff6b3533;z-index:0}
  .popt span{position:relative;z-index:1}
  .popt .cnt{float:right;font-weight:800}
  .popt.mine{border-color:var(--accent);font-weight:700}
  .popt.win{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e;font-weight:800}
  .msg.me .popt{border-color:#fff6}
  .poll-pop{display:none;flex-direction:column;gap:6px;padding:10px;border-top:1px solid var(--line);background:#fff;max-height:260px;overflow:auto}
  .poll-pop.on{display:flex}
  .poll-pop input,.poll-pop select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .poll-res button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
  .poll-res button:hover{background:#f1ede6}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:12px;background:#fff0e8;color:#d9480f;border-radius:999px;padding:3px 9px;cursor:pointer}
  body.dinner .gather, body.dinner .poll-pop{background:#1d2027;color:var(--ink)}
  body.dinner .gather-h{background:#1f2747;color:#bac8ff}
  body.dinner .gitem{border-color:#2c3139}
  body.dinner .tagx{background:#2a2e36;color:#c4bdb4}
  body.dinner .tagx.ok{background:#3d2e00;color:#ffd43b}
  body.dinner .tagx.vis{background:#11293d;color:#74c0fc}
  body.dinner .tagx.gath{background:#1f2747;color:#bac8ff}
  body.dinner .popt.win{background:#12301b;color:#8ce99a}
  body.dinner .gitem .join.in{background:#1d2027}

  /* ───── 내 이름 / 만든 사람 ───── */
  header{position:relative}
  header h1{padding-right:130px}
  .me-badge{position:absolute;right:14px;top:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-badge:hover{border-color:var(--accent)}
  .me-badge.admin{border-color:#e03131;color:#c92a2a}
  .made-by{position:fixed;left:12px;bottom:26px;z-index:20;font-size:11px;font-weight:800;letter-spacing:.12em;color:#1f1b16;background:#ffffffcc;padding:4px 9px;border-radius:6px;pointer-events:none}
  body.dinner .me-badge{background:#1d2027;color:var(--ink)}
  body.dinner .made-by{background:#14161bcc;color:#ebe7e1}
  @media (max-width: 760px){ .made-by{bottom:auto;top:calc(45vh - 30px)} }

  /* ───── 메뉴판 / 관리자 ───── */
  .menuline{font-size:12px;margin-top:5px;color:#5c554b}
  .menuline b{color:var(--ink)}
  .menuline .in{color:#2b8a3e;font-weight:700}
  .menuline .over{color:#c92a2a;font-weight:700}
  .menubox{margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .menubox h4{margin:0 0 6px;font-size:13px}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;padding:3px 0;border-bottom:1px dashed #eee}
  .mrow:last-of-type{border-bottom:0}
  .mrow .pr{font-weight:800}
  .mrow .pr.in{color:#2b8a3e}
  .mrow .x{border:0;background:transparent;color:#c92a2a;cursor:pointer;font-size:14px;padding:0 4px}
  .madd{display:flex;gap:5px;margin-top:7px}
  .madd input{min-width:0;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .madd input.mn{flex:1.6}.madd input.mp{flex:1}
  .admin-tools{display:flex;gap:6px;margin-top:6px}
  .link.danger{color:#c92a2a;border-color:#ffc9c9}
  .card.removed{opacity:.5;border-style:dashed}
  body.dinner .menubox{background:#14161b}
  body.dinner .menuline{color:#c4bdb4}
  body.dinner .mrow{border-color:#2c3139}

  /* ───── 입장: 이름 정하기 ───── */
  .welcome{position:fixed;inset:0;background:#1f1b16cc;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  .welcome.on{display:flex}
  .welcome .box{background:#fff;border-radius:18px;padding:26px 24px;width:min(360px,100%);text-align:center;box-shadow:0 20px 50px #0005}
  .welcome h2{margin:0 0 6px;font-size:21px}
  .welcome p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}
  .welcome input{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;text-align:center}
  .welcome input:focus{outline:none;border-color:var(--accent)}
  .welcome .btn{width:100%;margin-top:10px;padding:11px;font-size:15px}
  body.dinner .welcome .box{background:#1d2027;color:var(--ink)}
  body.dinner .welcome input{background:#14161b;color:var(--ink);border-color:var(--line)}

  /* ───── 저녁 모드 (다크) ───── */
  .meal-toggle{cursor:pointer;user-select:none}
  .meal-toggle .hint{font-size:11px;font-weight:600;color:var(--muted);margin-left:6px;vertical-align:3px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .budget{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:#fff0e8;border-radius:999px;padding:2px 9px;margin-top:6px}
  .link.ce{color:#9a6b00}
  .undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 10px 9px 16px;border-radius:10px;font-size:13px;display:none;align-items:center;gap:10px;z-index:61;box-shadow:0 4px 14px #0004}
  .undo.on{display:flex}
  .undo button{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:7px;padding:5px 10px;cursor:pointer}
  .budget .ceview{border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0;margin-left:2px}
  body.dinner .undo{background:#e9e5df;color:#14161b}
  .link.ce.on{background:#5c3d00;color:#ffd27a;border-color:#5c3d00}
  body.dinner{--bg:#14161b;--ink:#ebe7e1;--muted:#98a0ab;--line:#2c3139;--card:#1d2027;--accent:#ff8c4d;color-scheme:dark}
  body.dinner header, body.dinner .tab, body.dinner .link, body.dinner select, body.dinner input[type=text],
  body.dinner .pickbox, body.dinner .ptab, body.dinner .pickfoot, body.dinner .chat-panel, body.dinner .rooms,
  body.dinner .room, body.dinner .emoji-pop, body.dinner .iwbox, body.dinner .chat-form{background:#1d2027;color:var(--ink);border-color:var(--line)}
  body.dinner .btn{background:#e9e5df;color:#14161b}
  body.dinner .btn.accent{background:var(--accent);color:#fff}
  body.dinner .btn.ghost{background:#2a2e36;color:var(--ink)}
  body.dinner .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  body.dinner .card:hover{border-color:#454b55}
  body.dinner .pickhead, body.dinner .newroom{background:#2a2219}
  body.dinner .ptab.on{color:#fff}
  body.dinner .budget{background:#3a2618}
  body.dinner .chat-msgs{background:#14161b}
  body.dinner .msg .bubble{background:#2a2e36;color:var(--ink)}
  body.dinner .msg.me .bubble{background:var(--accent);color:#fff}
  body.dinner .msg .who{color:#c4bdb4}
  body.dinner .room:hover{background:#252931}
  body.dinner .room .av{background:#3a2618}
  body.dinner .chat-form input, body.dinner .newroom input{background:#14161b;color:var(--ink);border-color:var(--line)}

/* 배포할 때마다 바뀌는 버전 표시. 저장된 옛날 페이지가 열리면 최신 버전으로 자동 새로고침 */
const BUILD = "20261112110600";

(async () => {

/* ═════════════ 설정 ═════════════ */
const KAKAO_JS_KEY = "093c7ae93569953c7484af1227ef2cee";       // 카카오 JavaScript 키

// Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 복사한 값을 넣으세요. 비워두면 채팅만 꺼져요.
const FIREBASE_CONFIG = {

const GROUPS = {"한식": "#e8590c", "분식": "#d6336c", "양식": "#1971c2", "중식": "#c92a2a", "일식": "#2b8a3e", "기타": "#868e96"};

let pollDraft = [];     // 투표 후보 (가게 id)

function syncMealViews(){
  removedPlaces = removedAll[meal] || {};
  visits = visitsAll[meal] || {};
  hidden = hiddenByMeal[meal];
}
let menus = {};          // 공유 메뉴판 {가게: {메뉴id: {name, price}}}  ※ 관리자만 입력
const menuList = id => Object.entries(menus[id] || {}).map(([k, m]) => ({k, ...m})).sort((a, b) => a.price - b.price);
const minPrice = id => { const l = menuList(id); return l.length ? l[0].price : null; };     // 저녁: '7시 전 마감' 표시한 가게만 모아 보기
const KST_DAY = () => new Date((typeof nowMs === "function" ? nowMs() : Date.now()) + 9 * 3600 * 1000).toISOString().slice(0, 10);
const walkMin = d => Math.max(1, Math.round(d * 1.3 / 67));   // 직선거리 × 1.3(골목) ÷ 분당 67m
const vKey = () => meal === "dinner" ? "vDinner" : "vLunch";
const myVote = x => x[vKey()] !== undefined ? x[vKey()] : (meal === "lunch" ? x.v : undefined);
function rateStats(id){
  const r = ratings[id] || {}, key = meal === "dinner" ? "okDinner" : "okLunch";
  let up = 0, down = 0, ok = 0, no = 0;
  for(const x of Object.values(r)){ const v = myVote(x); if(v === 1) up++; if(v === -1) down++; if(x[key] === true) ok++; if(x[key] === false) no++; }
  return {up, down, ok, no, okMajority: ok > 0 && ok > no};
}
function daysAgo(ts){ if(!ts) return null; const now = Date.now(); return Math.floor((now - ts) / 86400000); }
function requireNick(){

/* 이름 입력 처리 (입장 화면·채팅 이름 칸 공통). 숫자만 6자리 이상이면 관리자 비밀번호로 시도 */
function submitNick(raw, done){

      .catch(err => toast(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" ? "관리자 비밀번호가 맞지 않아요" : "관리자 로그인 실패: " + (err.code || err.message), 4000));
    return;

  myNick = v; store.set(NICK_KEY, v); done && done();
}
function showWelcome(change){

}
const PICK_TABS_BASE = [["menu", "🍽 메뉴/가격", "#menuInfo"], ["photo", "📷 사진", "#photoview"], ["review", "💬 후기", "#review"]];
let PICK_TABS = PICK_TABS_BASE;
const CACHE_KEY = "lunch.places.v1", HIDDEN_KEY = "lunch.hidden", NICK_KEY = "lunch.nick";
const $ = s => document.querySelector(s);

let places = [], hidden = new Set(), updatedAt = "";
let map = null, info = null, markers = {}, selected = null, group = "전체";
let pickedId = null, pickTab = "menu", pickByDice = false;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const hiddenByMeal = {lunch: new Set(store.get(HIDDEN_KEY, [])), dinner: new Set(store.get(HIDDEN_KEY + ".dinner", []))};
hidden = hiddenByMeal.lunch;
const saveHidden = () => store.set(meal === "dinner" ? HIDDEN_KEY + ".dinner" : HIDDEN_KEY, [...hidden]);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kakaoUrl = p => `https://place.map.kakao.com/${p.id}`;   // https로 고정 (http는 사이트 안에서 막힘)
const pickSrc = p => kakaoUrl(p) + (PICK_TABS.find(x => x[0] === pickTab) || PICK_TABS[0])[2];
function toast(msg, ms = 2600){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); }

/* ───── 분류 ───── */
function skipPlace(cat){
  if(/^음식점 > (술집|간식)/.test(cat) || /카페/.test(cat)) return true;           // 술집·디저트·카페
  if(cat.includes("육류,고기") && !cat.includes("닭요리")) return true;             // 고기집 (닭요리는 남김)
  if(cat.includes("양꼬치")) return true;
  const parts = cat.split(">").map(x => x.trim()).slice(1);
  return parts.some(x => x === "회" || x.endsWith("회") || x.includes("횟집"));     // 회집
}
function foodGroup(cat){
  const parts = cat.split(">").map(x => x.trim());
  const main = parts[1] || "", sub = parts[2] || "";
  if(main === "퓨전요리") return ({"퓨전한식": "한식", "퓨전일식": "일식", "퓨전중식": "중식"})[sub] || "양식";
  if(main === "분식") return "분식";
  if(main === "한식") return "한식";
  if(["양식", "패스트푸드", "샐러드"].includes(main)) return "양식";
  if(main === "중식") return "중식";
  if(main === "일식") return "일식";
  return "기타";
}
function haversine(a, b, c, d){
  const R = 6371000, p1 = a * Math.PI / 180, p2 = c * Math.PI / 180, dp = p2 - p1, dl = (d - b) * Math.PI / 180;
  const x = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ───── 식당 수집 (카카오 지도 SDK 장소 검색) ───── */
function categorySearch(ps, lat, lng, radius, page){
  return new Promise(resolve => {
    ps.categorySearch("FD6", (data, status, pg) => {
      resolve({data: status === kakao.maps.services.Status.OK ? data : [], isEnd: !pg || !pg.hasNextPage});
    }, {location: new kakao.maps.LatLng(lat, lng), radius, page, sort: kakao.maps.services.SortBy.DISTANCE});
  });
}
async function collect(){
  const ps = new kakao.maps.services.Places();
  const grid = 5, half = 2, step = RADIUS * 0.9 / half, sub = Math.floor(step * 0.75) + 1;
  const mpl = 111320 * Math.cos(COMPANY.lat * Math.PI / 180);
  const found = {};
  for(let iy = -half; iy <= half; iy++) for(let ix = -half; ix <= half; ix++){
    const clat = COMPANY.lat + iy * step / 111320, clng = COMPANY.lng + ix * step / mpl;
    if(haversine(COMPANY.lat, COMPANY.lng, clat, clng) > RADIUS + sub) continue;
    for(let page = 1; page <= 3; page++){
      const {data, isEnd} = await categorySearch(ps, clat, clng, sub, page);
      for(const d of data){
        const lat = +d.y, lng = +d.x, dist = haversine(COMPANY.lat, COMPANY.lng, lat, lng);
        if(dist > RADIUS || skipPlace(d.category_name)) continue;
        found[d.id] = {id: d.id, name: d.place_name, category: d.category_name.split(">").pop().trim(), category_full: d.category_name,
          address: d.address_name, road_address: d.road_address_name, lat, lng, distance: Math.round(dist), kakao_url: d.place_url,
          group: foodGroup(d.category_name)};
      }
      if(isEnd) break;
    }
  }
  return Object.values(found).sort((a, b) => a.distance - b.distance);
}
async function loadPlaces(force){
  const cache = store.get(CACHE_KEY, null);
  if(!force && cache && Date.now() - cache.t < 24 * 3600 * 1000 && cache.places?.length){
    places = cache.places; updatedAt = cache.label; render(); return;
  }
  const b = $("#refresh"); b.disabled = true; b.textContent = "불러오는 중…";
  try{
    places = await collect();
    const d = new Date(); updatedAt = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    store.set(CACHE_KEY, {t: Date.now(), label: updatedAt, places});
    toast(`${places.length}곳을 불러왔어요`);
  }catch(err){ toast("식당을 불러오지 못했어요: " + err.message, 5000); }
  b.disabled = false; b.textContent = "식당 새로 불러오기";
  render();
}

/* ───── 목록 ───── */
function visible(allGroups){
  const q = $("#q").value.trim(), withHidden = $("#showHidden").checked;
  const arr = places.filter(p => {
    if(hidden.has(p.id) && !withHidden) return false;
    if(meal === "dinner" && showCE) return !!closedEarly[p.id];
    if(meal === "dinner" && closedEarly[p.id] && !withHidden) return false;
    if(removedPlaces[p.id] && !(isAdmin && withHidden)) return false;
    if($("#okOnly").checked){
      const mp = minPrice(p.id);
      // 메뉴판에 가격이 있으면 가격으로, 없으면 회사 사람들의 '식대 안에 됐어요' 표시로 판단
      if(mp !== null ? mp > MEALS[meal].budget : !rateStats(p.id).okMajority) return false;
    }
    if(!allGroups && group !== "전체" && p.group !== group) return false;
    if(q && !(p.name + " " + p.category_full).includes(q)) return false;
    return true;
  });
  if($("#sort").value === "name") arr.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  else arr.sort((a, b) => a.distance - b.distance);
  return arr;
}
function cardTags(p){
  const s = rateStats(p.id), v = visits[p.id], d = v ? daysAgo(v.ts) : null;
  const g = Object.values(gathers).filter(x => x.placeId === p.id && (x.meal || "lunch") === meal);
  const tags = [];
  if(g.length) tags.push(`<span class="tagx gath">🙋 오늘 ${esc(g[0].time)} 모집 중</span>`);
  if(s.up || s.down) tags.push(`<span class="tagx">👍 ${s.up} · 👎 ${s.down}</span>`);
  if(s.okMajority) tags.push(`<span class="tagx ok">💰 ${MEALS[meal].name} 식대 안쪽 (${s.ok})</span>`);
  if(d !== null && d <= 7) tags.push(`<span class="tagx vis">✅ ${d === 0 ? "오늘" : d + "일 전"} 다녀옴</span>`);
  return tags.length ? `<div class="tags">${tags.join("")}</div>` : "";
}
function menuLine(p){
  const l = menuList(p.id); if(!l.length) return "";
  const b = MEALS[meal].budget, m = l[0];
  return `<div class="menuline">🍽 <b>${esc(m.name)}</b> <span class="${m.price <= b ? "in" : "over"}">${m.price.toLocaleString()}원</span>${l.length > 1 ? ` 외 ${l.length - 1}개` : ""}</div>`;
}
function card(p){
  const h = hidden.has(p.id);
  return `<div class="card ${h ? "hiddenp" : ""} ${removedPlaces[p.id] ? "removed" : ""} ${selected === p.id ? "sel" : ""}" data-id="${esc(p.id)}">
    <div class="top">
      <div class="name"><span class="gtag" style="background:${GROUPS[p.group] || "#868e96"}">${esc(p.group)}</span>${esc(p.name)}</div>
      <div class="dist"><span class="walk">도보 ${walkMin(p.distance)}분</span> · ${p.distance}m</div>
    </div>
    <div class="meta">${esc(p.category)} · ${esc(p.road_address || p.address)}</div>
    ${menuLine(p)}
    ${cardTags(p)}
    <div class="row">${meal === "dinner" ? `<button class="link ce ${closedEarly[p.id] ? "on" : ""}" data-act="ce">${closedEarly[p.id] ? "↩ 7시 전 마감 취소" : "🌙 7시 전에 닫아요"}</button>` : ""}
      <span class="spacer"></span>
      ${isAdmin && removedPlaces[p.id] ? `<button class="link danger" data-act="remove">↩ 가게 복구</button>` : ""}
      <button class="link" data-act="hide">${h ? "다시 보기" : "숨기기"}</button></div>
  </div>`;
}
function timeSlots(){
  const [h0, h1] = meal === "dinner" ? [17, 21] : [11, 14];
  const out = [];
  for(let h = h0; h < h1; h++) for(const m of [0, 10, 20, 30, 40, 50]) out.push(`${h}:${String(m).padStart(2, "0")}`);
  return out;
}
function menuBox(p){
  const l = menuList(p.id), b = MEALS[meal].budget;
  if(!l.length && !isAdmin) return "";
  return `<div class="menubox"><h4>🍽 메뉴판 <small style="font-weight:500;color:var(--muted)">${MEALS[meal].name} 식대 ${b.toLocaleString()}원</small></h4>
    ${l.length ? l.map(m => `<div class="mrow"><span>${esc(m.name)}</span><span><span class="pr ${m.price <= b ? "in" : ""}">${m.price.toLocaleString()}원</span>${isAdmin ? `<button class="x" data-mdel="${esc(m.k)}" title="삭제">×</button>` : ""}</span></div>`).join("")
      : `<div style="font-size:12px;color:var(--muted)">아직 등록된 메뉴가 없어요. 아래 카카오 메뉴/가격 탭을 보면서 적어주세요.</div>`}
    ${isAdmin ? `<div class="madd"><input class="mn" id="mName" maxlength="30" placeholder="메뉴 (예: 김치찌개)"><input class="mp" id="mPrice" inputmode="numeric" maxlength="7" placeholder="가격"><button class="btn accent" data-pick="madd">추가</button></div>` : ""}
  </div>`;
}
function pickActions(p){
  const mine = (ratings[p.id] || {})[authUid()] || {}, s = rateStats(p.id), key = meal === "dinner" ? "okDinner" : "okLunch";
  const v = visits[p.id], d = v ? daysAgo(v.ts) : null;
  const slots = timeSlots(), now = new Date(), cur = now.getHours() * 60 + now.getMinutes();
  const def = slots.find(x => { const [h, m] = x.split(":").map(Number); return h * 60 + m >= cur + 10; }) || (meal === "dinner" ? "18:30" : "12:00");
  return `<div class="actions">
      <button class="link" data-pick="gather" style="background:#4c6ef5;color:#fff;border-color:#4c6ef5;font-weight:700">🙋 같이 갈 사람 모집</button>
      <button class="link up ${myVote(mine) === 1 ? "on" : ""}" data-rate="up">👍 ${s.up}</button>
      <button class="link down ${myVote(mine) === -1 ? "on" : ""}" data-rate="down">👎 ${s.down}</button>
      <button class="link ok ${mine[key] === true ? "on" : ""}" data-rate="ok">💰 ${MEALS[meal].budget.toLocaleString()}원 안에 됐어요 ${s.ok ? "(" + s.ok + ")" : ""}</button>
      <button class="link ${mine[key] === false ? "on" : ""}" data-rate="no">식대 넘었어요 ${s.no ? "(" + s.no + ")" : ""}</button>
      <button class="link ${d === 0 ? "on" : ""}" data-pick="visit">✅ ${d === 0 ? "오늘 다녀옴" : "오늘 여기 갔어요"}</button>
      <button class="link" data-pick="poll">📊 투표 후보에 추가</button>
      ${isAdmin ? `<button class="link danger" data-pick="remove">${removedPlaces[p.id] ? "↩ 가게 복구" : "🗑 가게 삭제"}</button>` : ""}
    </div>
    ${menuBox(p)}
    ${gatherFormOpen ? `<div class="gform">출발 시간 <select id="gTime">${slots.map(x => `<option ${x === def ? "selected" : ""}>${x}</option>`).join("")}</select>
      <button class="btn accent" data-pick="gatherGo" style="background:#4c6ef5">모집하기</button><button class="btn ghost" data-pick="gatherNo">취소</button></div>` : ""}`;
}
function pickPanel(){
  const p = places.find(x => x.id === pickedId);
  if(!p) return "";
  return `<div class="pickbox" id="pickbox">
    <div class="pickhead"><div style="flex:1"><div class="t">${pickByDice ? "🎲 오늘의 " + MEALS[meal].name : "📍 선택한 가게"} <span style="font-weight:500;opacity:.7">· 누르면 접혀요 ▲</span></div>
      <div class="n"><span class="gtag" style="background:${GROUPS[p.group] || "#868e96"}">${esc(p.group)}</span>${esc(p.name)}</div>
      <div class="meta">${esc(p.category)} · 도보 ${walkMin(p.distance)}분 · ${p.distance}m</div>
      ${pickActions(p)}</div></div>
    <div class="ptabs">${PICK_TABS.map(([k, label]) => `<button class="ptab ${k === pickTab ? "on" : ""}" data-ptab="${k}">${label}</button>`).join("")}</div>
    <iframe class="pickframe" src="${esc(pickSrc(p))}" title="카카오맵 가게 정보" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
    <div class="pickfoot">
      <a class="link k" href="${esc(pickSrc(p))}" target="_blank" rel="noopener noreferrer">새 창으로 크게 보기</a>
      <button class="link" data-pick="share">💬 채팅에 공유</button>
      <span class="spacer"></span>
      <button class="link" data-pick="again">🎲 다시 뽑기</button>
      <button class="link" data-pick="close">닫기</button>
    </div>
  </div>`;
}
function gatherSection(){
  const list = Object.entries(gathers).filter(([, g]) => (g.meal || "lunch") === meal).sort((a, b) => a[1].time.localeCompare(b[1].time, undefined, {numeric: true}));
  if(!list.length) return "";
  return `<div class="gather"><div class="gather-h">🙋 오늘 같이 가요 <small>밤 12시에 초기화</small></div>` + list.map(([id, g]) => {
    const mem = g.members || {}, names = Object.values(mem), inIt = !!mem[authUid()];
    const isHost = !!g.hostAuth && g.hostAuth === authUid();
    return `<div class="gitem ${hlGather === id && Date.now() < hlUntil ? "hl" : ""}" data-g="${esc(id)}">
      <div class="gt"><span class="gtime">${esc(g.time)}</span>${g.meal === "dinner" ? "🌙" : "☀️"} ${esc(clean(g.placeName))}</div>
      <div class="gm">${names.length}명 · ${names.map(n => esc(clean(n))).join(", ")}</div>
      <div class="gb"><button class="link join ${inIt ? "in" : ""}" data-gact="join">${inIt ? "빠지기" : "🙋 나도 갈래요"}</button>
        <button class="link room-btn" data-gact="room">💬 대화방 ${g.roomId && rooms[g.roomId] ? "들어가기" : "만들기"}</button>
        <button class="link" data-gact="link">🔗 링크</button>
        <button class="link" data-gact="view">가게 보기</button>
        ${isHost || isAdmin ? `<span class="spacer"></span><button class="link" data-gact="cancel">${isHost ? "모집 취소" : "삭제(관리자)"}</button>` : ""}</div></div>`;
  }).join("") + `</div>`;
}
function renderTabs(){
  const base = visible(true);   // 지금 모드(점심/저녁)에서 실제로 보이는 가게만 셈
  const names = ["전체", "한식", "분식", "양식", "중식", "일식"];
  if(places.some(p => p.group === "기타")) names.push("기타");
  $("#tabs").innerHTML = names.map(g => {
    const n = g === "전체" ? base.length : base.filter(p => p.group === g).length;
    const dot = GROUPS[g] ? `<span class="dot" style="background:${GROUPS[g]}"></span>` : "";
    return `<button class="tab ${g === group ? "on" : ""}" data-g="${g}">${dot}${g} <small>${n}</small></button>`;
  }).join("");
}
function render(){
  $("#sub").textContent = `${COMPANY.address} 반경 ${RADIUS}m${updatedAt ? " · " + updatedAt + " 기준" : ""}`;
  const ceCount = Object.keys(closedEarly).length;
  const mb = $("#meBadge");
  mb.textContent = myNick ? `👤 ${clean(myNick)}${isAdmin ? " · 관리자" : ""}` : "👤 이름 정하기";
  mb.classList.toggle("admin", !!isAdmin);
  $("#okLabel").textContent = `💰 ${MEALS[meal].budget.toLocaleString()}원 이하만`;
  if(!ceCount) showCE = false;
  $("#budget").innerHTML = `${MEALS[meal].icon} ${MEALS[meal].name} 식대 ${MEALS[meal].budget.toLocaleString()}원` +
    (meal === "dinner" && ceCount ? ` · 7시 전 마감 ${ceCount}곳 제외 <button class="ceview" id="ceView">${showCE ? "목록으로 돌아가기" : "보기·취소"}</button>` : "");
  renderTabs();
  const arr = visible();
  $("#count").textContent = places.length ? `${arr.length}곳 표시 중` : "";
  const old = $("#pickbox"), keep = old && old.dataset.id === pickedId ? old : null;
  const typing = {n: $("#mName")?.value, p: $("#mPrice")?.value, f: document.activeElement?.id};
  $("#list").innerHTML = gatherSection() + pickPanel() + (arr.length ? arr.map(card).join("")
    : places.length ? ($("#okOnly").checked
        ? `<div class="empty">아직 <b>${MEALS[meal].budget.toLocaleString()}원 이하</b>로 표시된 가게가 없어요.<br>가게를 누르고 <b>💰 ${MEALS[meal].budget.toLocaleString()}원 안에 됐어요</b>를 눌러주세요.<br><small>회사 사람들이 표시할수록 이 목록이 채워져요</small></div>`
        : `<div class="empty">조건에 맞는 식당이 없어요.</div>`)
    : `<div class="empty">식당을 불러오는 중이에요…</div>`);
  if(keep && $("#pickbox")){   // 같은 가게면 카카오맵 화면을 다시 로딩하지 않음
    const fresh = $("#pickbox");
    keep.querySelector(".pickhead").replaceWith(fresh.querySelector(".pickhead"));
    fresh.replaceWith(keep);
    if($("#mName") && typing.n != null){ $("#mName").value = typing.n; $("#mPrice").value = typing.p; if(typing.f === "mName" || typing.f === "mPrice") $("#" + typing.f).focus(); }
  }
  if($("#pickbox")) $("#pickbox").dataset.id = pickedId;
  syncMarkers(arr);
}

/* ───── 지도 ───── */
function initMap(){
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
  s.onerror = () => { $("#mapMsg").innerHTML = "카카오맵을 불러오지 못했어요.<br>카카오 개발자 콘솔의 JavaScript SDK 도메인에<br><b>" + esc(location.origin) + "</b> 이 등록됐는지 확인하세요."; };
  s.onload = () => kakao.maps.load(() => {
    $("#mapMsg").remove();
    const pos = new kakao.maps.LatLng(COMPANY.lat, COMPANY.lng);
    map = new kakao.maps.Map($("#map"), {center: pos, level: 3});
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    new kakao.maps.CustomOverlay({position: pos, content: '<div class="company-pin">🏢 우리 회사</div>', yAnchor: 1.4, zIndex: 3}).setMap(map);
    new kakao.maps.Circle({center: pos, radius: RADIUS, strokeWeight: 1, strokeColor: "#ff6b35", strokeOpacity: .6, strokeStyle: "dash", fillColor: "#ff6b35", fillOpacity: .04}).setMap(map);
    loadPlaces(false);
  });
  document.head.appendChild(s);
}
function syncMarkers(arr){
  if(!map) return;
  const show = new Set(arr.map(p => p.id));
  for(const p of places){
    let m = markers[p.id];
    if(!m && show.has(p.id)){
      const el = document.createElement("div");
      el.className = "pin"; el.title = p.name; el.style.background = GROUPS[p.group] || "#868e96";
      el.addEventListener("click", () => openPlace(p.id, false));
      m = markers[p.id] = new kakao.maps.CustomOverlay({position: new kakao.maps.LatLng(p.lat, p.lng), content: el, zIndex: 2});
      m._el = el;
    }
    if(m) m.setMap(show.has(p.id) ? map : null);
  }
  if(info && selected && !show.has(selected)) info.setMap(null);
}
function focusPlace(id){
  const p = places.find(x => x.id === id); if(!p) return;
  selected = id;
  document.querySelectorAll(".card.sel").forEach(e => e.classList.remove("sel"));
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(el) el.classList.add("sel");
  document.querySelectorAll(".pin.sel").forEach(e => e.classList.remove("sel"));
  if(map && markers[id]){
    markers[id]._el.classList.add("sel");
    if(info) info.setMap(null);
    info = new kakao.maps.CustomOverlay({position: markers[id].getPosition(), yAnchor: 1, zIndex: 5,
      content: `<div class="iwbox"><b>${esc(p.name)}</b><br>${esc(p.group)} · ${esc(p.category)} · ${p.distance}m</div>`});
    info.setMap(map);
    map.panTo(markers[id].getPosition());
  }
}
function closePlace(){
  const was = pickedId;
  pickedId = null; selected = null;
  if(info){ info.setMap(null); info = null; }
  document.querySelectorAll(".pin.sel").forEach(e => e.classList.remove("sel"));
  render();
  // 접은 뒤 맨 위로 튀지 않고, 방금 보던 가게 카드 자리에 그대로 있게
  const card = was && document.querySelector(`.card[data-id="${CSS.escape(was)}"]`);
  if(card){
    card.classList.add("sel");
    card.scrollIntoView({block: "center"});
    setTimeout(() => card.classList.remove("sel"), 1200);
  }
}
function openPlace(id, byDice){
  // 이미 열려 있는 가게를 다시 누르면 접기
  if(!byDice && pickedId === id){ closePlace(); return; }
  if(pickedId !== id) pickTab = "menu";
  pickedId = id; pickByDice = byDice;
  render(); focusPlace(id);
  $("#list").scrollTop = 0;
  if(window.innerWidth <= 760) $("aside").scrollIntoView({behavior: "smooth"});
}

/* ───── 이벤트 ───── */
$("#homeBtn").addEventListener("click", () => {
  if(!map) return;
  if(info) info.setMap(null);
  map.setLevel(3); map.panTo(new kakao.maps.LatLng(COMPANY.lat, COMPANY.lng));
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  group = b.dataset.g;
  // 종류 탭을 바꾸면 열려 있던 가게 정보는 닫고 그 종류 목록만 보여줌
  pickedId = null; selected = null;
  if(info){ info.setMap(null); info = null; }
  render(); $("#list").scrollTop = 0;
});
$("#list").addEventListener("click", e => {
  const pt = e.target.closest(".ptab");
  if(pt){
    pickTab = pt.dataset.ptab;
    const p = places.find(x => x.id === pickedId); if(!p) return;
    document.querySelectorAll(".ptab").forEach(b => b.classList.toggle("on", b.dataset.ptab === pickTab));
    const fr = document.createElement("iframe");
    fr.className = "pickframe"; fr.title = "카카오맵 가게 정보"; fr.src = pickSrc(p);
    fr.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"); fr.referrerPolicy = "no-referrer";
    document.querySelector(".pickframe").replaceWith(fr);
    const a = document.querySelector(".pickfoot a.k"); if(a) a.href = pickSrc(p);
    return;
  }
  // 맨 위 '선택한 가게' 제목 부분을 한 번 더 누르면 접기 (버튼·입력칸 누른 건 제외)
  if(e.target.closest(".pickhead") && !e.target.closest("button, select, input, a, .menubox, .actions, .gform")){ closePlace(); return; }
  const pk = e.target.dataset.pick;
  if(pk){
    const p = places.find(x => x.id === pickedId);
    if(pk === "again") $("#pick").click();
    else if(pk === "close") closePlace();
    else if(pk === "share" && p) shareToChat(p);
    else if(pk === "gather"){ if(!requireNick()) return; gatherFormOpen = !gatherFormOpen; render(); }
    else if(pk === "gatherNo"){ gatherFormOpen = false; render(); }
    else if(pk === "gatherGo" && p) createGather(p, $("#gTime").value);
    else if(pk === "visit" && p) markVisit(p);
    else if(pk === "madd" && p) addMenu(p);
    else if(pk === "remove" && p) removeFromPanel(p, e.target.closest("[data-pick]"));
    else if(pk === "poll" && p){
      if(pollDraft.includes(p.id)) toast("이미 투표 후보에 있어요");
      else if(pollDraft.length >= 4) toast("후보는 4곳까지예요");
      else { pollDraft.push(p.id); toast(`투표 후보 ${pollDraft.length}곳 · 채팅방의 📊에서 올릴 수 있어요`); }
    }
    return;
  }
  const md = e.target.closest("[data-mdel]")?.dataset.mdel;
  if(md){ const p = places.find(x => x.id === pickedId); if(p && isAdmin) db.ref(`lunchchat/menus/${p.id}/${md}`).remove().then(() => toast("메뉴를 지웠어요")).catch(err => toast("삭제 실패: " + err.message, 4000)); return; }
  const rt = e.target.closest("[data-rate]")?.dataset.rate;
  if(rt){ const p = places.find(x => x.id === pickedId); if(p) ratePlace(p, rt); return;
    return;
  }
  const gi = e.target.closest(".gitem");
  if(gi){
    const gid = gi.dataset.g, g = gathers[gid], act = e.target.closest("[data-gact]")?.dataset.gact;
    if(!g || !act) return;
    if(act === "view") openPlace(g.placeId, false);
    else if(act === "room") openGatherRoom(gid, g);
    else if(act === "link") shareGatherLink(gid, g);
    else if(act === "join"){
      if(!requireNick()) return;
      ensureAuth().then(u => {
        const ref = db.ref(`lunchchat/gather/${KST_DAY()}/${gid}/members/${u.uid}`);
        return (g.members || {})[u.uid] ? ref.remove() : ref.set(myNick);
      }).catch(err => toast("실패: " + err.message, 4000));
    }else if(act === "cancel") db.ref(`lunchchat/gather/${KST_DAY()}/${gid}`).remove()
      .then(() => toast("모집을 취소했어요"))
      .catch(() => toast("모집한 본인만 취소할 수 있어요", 3500));
    return;
  }
  const c = e.target.closest(".card"); if(!c) return;
  const id = c.dataset.id;
  if(e.target.dataset.act === "ce"){
    if(!initFirebase()){ toast("저장 서버에 연결할 수 없어요"); return; }
    const ref = db.ref("lunchchat/closedEarly/" + id), name = (places.find(x => x.id === id) || {}).name || "";
    if(closedEarly[id]){
      ensureAuth().then(() => ref.remove()).then(() => toast(`'${name}' 다시 저녁 목록에 넣었어요`)).catch(err => toast("저장 실패: " + err.message, 4000));
    }else{
      ensureAuth().then(() => ref.set(true))
        .then(() => showUndo(`🌙 '${name}' 저녁 목록에서 뺐어요`, () => ref.remove().then(() => toast("되돌렸어요"))))
        .catch(err => toast("저장 실패: " + err.message, 4000));
    }
    return;
  }
  if(e.target.dataset.act === "remove"){
    if(!isAdmin) return;
    const btn = e.target, name = (places.find(x => x.id === id) || {}).name || "";
    if(removedPlaces[id]){
      db.ref(`lunchchat/removed/${meal}/${id}`).remove().then(() => toast(`'${name}' 복구했어요`)).catch(err => toast("실패: " + err.message, 4000));
      return;
    }
    if(btn.dataset.armed !== "1"){
      btn.dataset.armed = "1"; btn.textContent = "한 번 더 누르면 삭제";
      setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = ""; btn.textContent = "🗑 가게 삭제"; } }, 4000);
      return;
    }
    db.ref(`lunchchat/removed/${meal}/${id}`).set(true)
      .then(() => toast(`'${name}' ${MEALS[meal].name} 목록에서 삭제했어요 · 숨긴 곳을 켜면 복구할 수 있어요`, 4000))
      .catch(err => toast("삭제 실패: " + err.message, 4000));
    return;
  }
  if(e.target.dataset.act === "hide"){
    hidden.has(id) ? hidden.delete(id) : hidden.add(id);
    saveHidden(); render(); return;
  }
  openPlace(id, false);
});
["#sort", "#showHidden", "#okOnly"].forEach(s => $(s).addEventListener("change", render));
$("#list").addEventListener("keydown", e => {   // 메뉴 입력칸에서 Enter = 추가

/* ═════════════ 팀 채팅 (Firebase Realtime Database) ═════════════
   lunchchat/rooms/{방}  : {name, createdAt, createdBy, lastAt, lastText, lastNick, lastUid}
   lunchchat/msgs/{방}/{메시지} : {uid, nick, text, ts, place}
   마지막 대화(lastAt)로부터 하루가 지난 방은 누가 사이트를 열 때 자동 삭제돼요. */
const DAY = 24 * 3600 * 1000;
// 관리자: 이름 칸에 관리자 비밀번호를 입력하면 이 계정으로 로그인 (비밀번호는 코드에 없음, Firebase가 확인)
const ADMIN_EMAIL = "admin@lunch-chat-655ae.firebaseapp.com";
const ADMIN_UID = "bpvZRWF6STZ8w4KmuBP5MTR6kO63";
let isAdmin = false;

/* ── 욕설 가리기: 보낼 때와 보여줄 때 모두 *** 로 바꿈 ── */
const BAD_WORDS = ["씨발","시발","씨바","시바","씨빨","씨팔","시팔","쉬발","쓰발","ㅅㅂ","ㅆㅂ","ㅅ ㅂ","병신","븅신","빙신","ㅂㅅ","개새끼","개새기","개색기","개색끼","개쌔끼","새끼","새기야","지랄","ㅈㄹ","좆","존나","졸라","ㅈㄴ","엿먹","미친놈","미친년","미친새","또라이","꺼져","닥쳐","닥치","염병","썅","니미","느금","니애미","애미","애비","창녀","호로","fuck","shit","bitch","asshole","dick"];
const SEP = "[\\s0-9._\\-~!@#$%^&*+=|/\\\\]*";
const BAD_RE = new RegExp(BAD_WORDS.map(w => [...w.replace(/\s/g, "")].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(SEP)).join("|"), "gi");
// 성적인 표현
const SEXUAL_WORDS = ["섹스","쎅스","섹쓰","쌕스","야동","야사","음란","자위","딸딸이","딸쳐","딸치","꼴린","꼴려","꼴리네","성교","강간","성폭행","따먹","떡치","떡쳐","떡칠","박고싶","박아줘","빨아줘","핥아","젖꼭지","유두","가슴만지","엉덩이만지","거시기","정액","사정해","발기","콘돔","오르가즘","신음","야한","벗겨","알몸","성인방","원나잇","sex","porn","pussy","cock","boobs","nude","horny","nsfw"];
const SEXUAL_RE = new RegExp(SEXUAL_WORDS.map(w => [...w].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(SEP)).join("|"), "gi");
// '보지/자지'는 "보지 마", "자지 않아" 같은 평범한 말은 남기고 나머지만 가림
const ORGAN_RE = new RegExp("(보|자)" + SEP + "지(?!" + SEP + "(마|말|않|못|도|요|만|는|가|를|\\?|$))", "g");
const mask = m => "*".repeat([...m].length);
const clean = s => String(s ?? "").replace(BAD_RE, mask).replace(SEXUAL_RE, mask).replace(ORGAN_RE, mask);
const EMOJIS = ["😀","😂","🤣","😊","😍","🥰","😋","🤤","😎","🤔","😴","😭","😡","🥲","🙏","👍","👎","👏","🙌","🔥","💯","❤️","✨","🎉","🍚","🍜","🍲","🍛","🍣","🍱","🥟","🍝","🍕","🍔","🌮","🥗","🍗","🥩","🍤","🍙","🍳","🥘","☕","🧋","🍺","🏃","⏰","✅"];
let db = null, fbReady = false, serverOffset = 0;
let msgEls = {}, msgData = {};
let rooms = {}, view = "rooms", currentRoom = null, msgQuery = null, creating = false, pendingShare = null;
let chatOpen = false, unread = 0, myNick = store.get(NICK_KEY, "");
const seenAt = store.get("lunch.seen", {});   // 방별로 마지막으로 읽은 시각
const myId = store.get("lunch.uid", null) || (() => { const id = Math.random().toString(36).slice(2, 10); store.set("lunch.uid", id); return id; })();
const nowMs = () => Date.now() + serverOffset;

function ago(ts){
  if(!ts) return "";
  const s = Math.max(0, (nowMs() - ts) / 1000);
  if(s < 60) return "방금 전";
  if(s < 3600) return `${Math.floor(s / 60)}분 전`;
  if(s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  return `${Math.floor(s / 86400)}일 전`;
}
function chatTime(ts){ const d = new Date(ts); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }
function setBadge(){
  unread = Object.entries(rooms).filter(([id, r]) => r.lastAt && r.lastUid !== myId && r.lastAt > (seenAt[id] || 0) && !(chatOpen && view === "room" && currentRoom === id)).length;
  const b = $("#chatBadge"); b.textContent = unread > 99 ? "99+" : unread; b.style.display = unread ? "flex" : "none";
}
function markSeen(id){ seenAt[id] = nowMs(); store.set("lunch.seen", seenAt); }

function initFirebase(){
  if(fbReady) return true;
  if(!FIREBASE_CONFIG || !window.firebase) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  }catch(e){ return false; }
  fbReady = true;
  db.ref(".info/serverTimeOffset").on("value", s => { serverOffset = s.val() || 0; });
  if(firebase.auth) firebase.auth().onAuthStateChanged(u => {
    isAdmin = !!u && u.uid === ADMIN_UID;
    if(!u) firebase.auth().signInAnonymously().catch(() => {});
    renderSoon();
    if(view === "rooms") showRooms(); else if(view === "room" && currentRoom) openRoom(currentRoom);
  });
  const roomsRef = db.ref("lunchchat/rooms");
  const onRoom = s => { rooms[s.key] = s.val(); cleanupIfStale(s.key); refreshRooms(); renderSoon(); };
  roomsRef.on("child_added", onRoom);
  roomsRef.on("child_changed", onRoom);
  roomsRef.on("child_removed", s => {
    delete rooms[s.key];
    if(currentRoom === s.key){ toast("하루 동안 대화가 없어서 방이 닫혔어요"); showRooms(); }
    refreshRooms();
  });
  return true;
}
function cleanupIfStale(id){
  const r = rooms[id];
  if(!r || !r.lastAt || nowMs() - r.lastAt < DAY) return;
  // 메시지 먼저, 그다음 방 삭제 (규칙이 하루 지난 방만 지우도록 허용)
  db.ref("lunchchat/msgs/" + id).remove().catch(() => {}).then(() => db.ref("lunchchat/rooms/" + id).remove().catch(() => {}));
}
function liveRooms(){
  return Object.entries(rooms).filter(([, r]) => r && r.name && (!r.lastAt || nowMs() - r.lastAt < DAY))
    .sort((a, b) => (b[1].lastAt || 0) - (a[1].lastAt || 0));
}

/* ── 화면 그리기 ── */

  $("#emojiPop").classList.remove("on"); $("#pollPop").classList.remove("on");
  $("#roomsView").style.display = which === "rooms" ? "block" : "none";
  $("#chatMsgs").style.display = which === "rooms" ? "none" : "flex";
  $("#chatForm").style.display = which === "room" ? "flex" : "none";
}
function showSetup(html){

  head(`<b>🍚 점심 팀</b><button class="x" data-c="close" aria-label="닫기">×</button>`);
  $("#chatMsgs").innerHTML = `<div class="chat-setup">${html}</div>`;
}

  view = "nick"; showOnly("nick");
  head(`<b>🍚 점심 팀</b><button class="x" data-c="close" aria-label="닫기">×</button>`);
  $("#chatMsgs").innerHTML = `<div class="chat-empty">채팅에서 쓸 이름을 정해주세요<br><br>
    <input id="nickIn" maxlength="20" placeholder="예: 디자인팀 준" value="${esc(myNick)}" style="font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;width:200px"><br><br>
    <button class="btn accent" id="nickOk">확인</button></div>`;
  const ok = () => submitNick($("#nickIn").value, () => { showRooms(); render(); });
  $("#nickOk").onclick = ok;
  $("#nickIn").onkeydown = e => { if(e.key === "Enter") ok(); };
  setTimeout(() => $("#nickIn")?.focus(), 50);

function showRooms(){
  if(msgQuery){ msgQuery.off(); msgQuery = null; }
  view = "rooms"; currentRoom = null; showOnly("rooms");
  head(`<b>🍚 점심 팀</b><small>· <a href="#" data-c="nick" style="color:inherit">${esc(myNick)}</a></small>
        <button class="plus" data-c="new" title="팀 만들기" aria-label="팀 만들기">+</button><button class="x" data-c="close" aria-label="닫기">×</button>`);
  refreshRooms();
}
function refreshRooms(){
  setBadge();
  if(view !== "rooms") return;
  const list = liveRooms();
  const form = creating ? `<form class="newroom" id="newRoomForm"><input id="newRoomName" maxlength="20" placeholder="팀 이름 (예: 디자인팀 점심)"><button class="btn accent" type="submit">만들기</button><button class="btn ghost" type="button" data-c="cancel">취소</button></form>` : "";
  const items = list.map(([id, r]) => {
    const isNew = r.lastUid && !(r.lastUid === myId && r.lastNick === myNick) && r.lastAt > (seenAt[id] || 0);
    const last = r.lastText ? `${r.lastNick ? esc(clean(r.lastNick)) + ": " : ""}${esc(clean(r.lastText))}` : "아직 대화가 없어요";
    const nm = clean(r.name);
    return `<div class="room" data-room="${esc(id)}"><div class="av">${esc([...nm][0] || "팀")}</div>
      <div class="rb"><div class="rn">${esc(nm)}</div><div class="rl">${last}</div></div>
      ${isNew ? '<span class="dot"></span>' : ""}<div class="rt">${ago(r.lastAt)}</div>
      ${isAdmin ? `<button class="del" data-del="${esc(id)}">삭제</button>` : ""}</div>`;
  }).join("");
  const adminBar = isAdmin ? `<div class="admin-bar">🔧 관리자 모드 · 팀을 삭제할 수 있어요<button data-c="logout">나가기</button></div>` : "";
  $("#roomsView").innerHTML = adminBar + form + (items
    ? items + `<div class="rooms-note">하루 동안 대화가 없는 팀은 자동으로 사라져요</div>`
    : (creating ? "" : `<div class="rooms-empty">아직 만들어진 팀이 없어요<br><br><button class="btn accent" data-c="new">+ 팀 만들기</button></div>`));
  if(creating){
    $("#newRoomForm").onsubmit = e => { e.preventDefault(); createRoom($("#newRoomName").value); };
    setTimeout(() => $("#newRoomName")?.focus(), 30);
  }
}
function createRoom(name){
  name = clean(name.trim().slice(0, 20)); if(!name) return;
  const ref = db.ref("lunchchat/rooms").push();
  const ts = firebase.database.ServerValue.TIMESTAMP;
  ensureAuth().then(() => ref.set({name, createdAt: ts, createdBy: myNick.slice(0, 20), lastAt: ts, lastText: "", lastNick: "", lastUid: ""}))
    .then(() => { creating = false; openRoom(ref.key); })
    .catch(err => toast("팀을 만들지 못했어요: " + err.message, 4000));
}
let armedDelete = null, armedTimer = null;
function deleteRoom(id, btn){
  const r = rooms[id]; if(!r) return;
  if(!isAdmin){ toast("관리자 모드에서만 삭제할 수 있어요"); return; }
  if(armedDelete !== id){   // 첫 번째 클릭: 확인 상태로
    armedDelete = id;
    if(btn){ btn.dataset.label = btn.textContent; btn.textContent = "한 번 더 누르면 삭제"; }
    clearTimeout(armedTimer);
    armedTimer = setTimeout(() => { armedDelete = null; if(btn && btn.isConnected) btn.textContent = btn.dataset.label || "삭제"; }, 4000);
    return;
  }
  armedDelete = null; clearTimeout(armedTimer);
  if(btn) btn.textContent = "삭제 중…";
  db.ref("lunchchat/msgs/" + id).remove()
    .then(() => db.ref("lunchchat/rooms/" + id).remove())
    .then(() => { toast(`'${clean(r.name)}' 팀을 삭제했어요`); if(currentRoom === id) showRooms(); })
    .catch(err => { toast("삭제 실패: " + err.message, 5000); if(btn && btn.isConnected) btn.textContent = "삭제"; });
}
function openRoom(id){
  const r = rooms[id]; if(!r && !id) return;
  if(msgQuery){ msgQuery.off(); msgQuery = null; }
  view = "room"; currentRoom = id; showOnly("room");
  head(`<button class="back" data-c="back" aria-label="팀 목록">‹</button><b>${esc(clean((rooms[id] || {}).name || "팀"))}</b>
    ${isAdmin ? `<button data-c="delroom" style="margin-left:auto;font-size:13px;background:#e03131;border-radius:8px;padding:4px 9px">삭제</button>` : ""}
    <button class="x" data-c="close" aria-label="닫기" style="margin-left:${isAdmin ? "6px" : "auto"}">×</button>`);
  $("#chatMsgs").innerHTML = `<div class="chat-empty" id="chatEmpty">첫 메시지를 남겨보세요 😋<br>"오늘 점심 뭐 드실래요?"</div>`;
  msgQuery = db.ref("lunchchat/msgs/" + id).orderByChild("ts").limitToLast(100);
  msgEls = {}; msgData = {};
  msgQuery.on("child_changed", snap => {
    const m = snap.val(); if(!m || !msgEls[snap.key]) return;
    m._key = snap.key; const el = renderMsg(m); msgEls[snap.key].replaceWith(el); msgEls[snap.key] = el; msgData[snap.key] = m;
  });
  msgQuery.on("child_added", snap => {
    const m = snap.val(); if(!m || !m.text) return;
    m._key = snap.key; msgData[snap.key] = m;
    $("#chatEmpty")?.remove();
    const box = $("#chatMsgs");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const el = renderMsg(m); msgEls[snap.key] = el;
    box.appendChild(el);
    if(atBottom || m.uid === myId) box.scrollTop = box.scrollHeight;
    markSeen(id); setBadge();
  });
  markSeen(id); setBadge();
  if(pendingShare){ const p = pendingShare; pendingShare = null; sharePlace(p); }
  setTimeout(() => $("#chatInput").focus(), 50);
}
function pollHtml(key, m){
  const opts = m.poll.options || [], votes = m.votes || {}, ended = nowMs() >= m.poll.endsAt;
  const counts = opts.map((_, i) => Object.values(votes).filter(v => v === i).length);
  const total = counts.reduce((a, b) => a + b, 0), max = Math.max(0, ...counts);
  const left = Math.max(0, Math.ceil((m.poll.endsAt - nowMs()) / 60000));
  const winners = ended && max > 0 ? counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0) : [];
  return `<div class="poll" data-poll="${esc(key)}"><div class="pq">📊 메뉴 투표<small>${ended ? "마감 · " + total + "표" : left + "분 남음 · " + total + "표"}</small></div>` +
    opts.map((o, i) => `<button class="popt ${votes[authUid()] === i ? "mine" : ""} ${winners.includes(i) ? "win" : ""}" data-pi="${i}" data-pid="${esc(o.id)}">
      <div class="bar" style="width:${total ? Math.round(counts[i] / total * 100) : 0}%"></div>
      <span>${winners.includes(i) ? "🏆 " : ""}${esc(clean(o.name))}</span><span class="cnt">${counts[i]}</span></button>`).join("") +
    (ended ? (winners.length ? `<div style="font-size:12px;margin-top:6px">결과: ${winners.map(i => esc(clean(opts[i].name))).join(", ")} (눌러서 가게 보기)</div>` : `<div style="font-size:12px;margin-top:6px">투표한 사람이 없어요</div>`) : "") + `</div>`;
}
function renderMsg(m){
  const me = m.uid === myId && m.nick === myNick;   // 같은 기기에서 이름을 바꿔 쓰는 경우도 구분
  const div = document.createElement("div");
  div.className = "msg" + (me ? " me" : "");
  let body = m.poll ? pollHtml(m._key, m) : esc(clean(m.text));
  if(m.place) body += `<span class="share" data-place="${esc(m.place)}">지도에서 보기 →</span>`;
  div.innerHTML = `<div class="who">${esc(clean(m.nick))}${me ? " (나)" : ""}</div><div class="bubble">${body}</div><div class="time">${chatTime(m.ts)}</div>`;
  return div;
}
function sendChat(text, place){
  text = clean((text || "").trim().slice(0, 300));
  if(!db || !currentRoom || !text) return;
  const ts = firebase.database.ServerValue.TIMESTAMP, id = currentRoom;
  ensureAuth().then(() => db.ref("lunchchat/msgs/" + id).push({uid: myId, nick: myNick.slice(0, 20), text, place: place || null, ts}))
    .then(() => db.ref("lunchchat/rooms/" + id).update({lastAt: ts, lastText: text.slice(0, 60), lastNick: myNick.slice(0, 20), lastUid: myId}))
    .catch(err => toast("전송 실패: " + err.message, 4000));
}
function sharePlace(p){ sendChat(`📍 ${p.name} 어때요? (${p.group} · ${p.category} · ${p.distance}m)`, p.id); }
function shareToChat(p){
  if(!initFirebase()){ toast("채팅을 사용할 수 없어요"); return; }
  openChat();
  if(!myNick){ pendingShare = p; return; }
  if(view === "room" && currentRoom){ sharePlace(p); return; }
  pendingShare = p; toast("공유할 팀을 골라주세요");
}

function openChat(){
  chatOpen = true; $("#chatPanel").classList.add("on");
  if(!FIREBASE_CONFIG){ showSetup("채팅 설정(FIREBASE_CONFIG)이 비어 있어요."); return; }
  if(!initFirebase()){ showSetup("채팅 서버(Firebase)를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  if(!myNick) askNick();
  else if(view === "room" && currentRoom && rooms[currentRoom]) openRoom(currentRoom);
  else showRooms();
}
function closeChat(){ chatOpen = false; $("#chatPanel").classList.remove("on"); if(msgQuery){ msgQuery.off(); msgQuery = null; } setBadge(); }

$("#chatFab").addEventListener("click", () => chatOpen ? closeChat() : openChat());
$("#chatHead").addEventListener("click", e => {
  const c = e.target.closest("[data-c]")?.dataset.c; if(!c) return;
  e.preventDefault();
  if(c === "close") closeChat();
  else if(c === "back") showRooms();
  else if(c === "new"){ creating = true; refreshRooms(); }
  else if(c === "nick") askNick();
  else if(c === "delroom" && currentRoom) deleteRoom(currentRoom, e.target.closest("[data-c]"));
});
$("#roomsView").addEventListener("click", e => {
  const c = e.target.closest("[data-c]")?.dataset.c;
  if(c === "new"){ creating = true; refreshRooms(); return; }
  if(c === "cancel"){ creating = false; refreshRooms(); return; }
  if(c === "logout"){ firebase.auth().signOut().then(() => { isAdmin = false; toast("관리자 모드를 나왔어요"); showRooms(); }); return; }
  const del = e.target.closest("[data-del]"); if(del){ e.stopPropagation(); deleteRoom(del.dataset.del, del); return; }
  const r = e.target.closest(".room"); if(r) openRoom(r.dataset.room);
});
$("#chatForm").addEventListener("submit", e => { e.preventDefault(); sendChat($("#chatInput").value); $("#chatInput").value = ""; $("#emojiPop").classList.remove("on"); });
$("#emojiPop").innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join("");
$("#emojiBtn").addEventListener("click", () => { $("#pollPop").classList.remove("on"); $("#emojiPop").classList.toggle("on"); });
function renderPollPop(){
  $("#pollChips").innerHTML = pollDraft.map(id => { const p = places.find(x => x.id === id); return p ? `<span class="chip" data-rm="${esc(id)}">${esc(p.name)} ×</span>` : ""; }).join("") || `<span style="font-size:12px;color:var(--muted)">아직 후보가 없어요. 아래에서 검색하거나, 가게 정보창의 '투표 후보에 추가'를 눌러요.</span>`;
  const q = $("#pollSearch").value.trim();
  const res = q ? places.filter(p => p.name.includes(q) && !pollDraft.includes(p.id)).slice(0, 6) : [];
  $("#pollRes").innerHTML = res.map(p => `<button type="button" data-add="${esc(p.id)}">${esc(p.name)} <small style="color:var(--muted)">${esc(p.group)} · 도보 ${walkMin(p.distance)}분</small></button>`).join("");
}
$("#pollBtn").addEventListener("click", () => { $("#emojiPop").classList.remove("on"); $("#pollPop").classList.toggle("on"); renderPollPop(); $("#pollSearch").focus(); });
$("#pollSearch").addEventListener("input", renderPollPop);
$("#pollPop").addEventListener("click", e => {
  const add = e.target.closest("[data-add]")?.dataset.add, rm = e.target.closest("[data-rm]")?.dataset.rm;
  if(add){ if(pollDraft.length >= 4){ toast("후보는 4곳까지예요"); return; } pollDraft.push(add); $("#pollSearch").value = ""; renderPollPop(); }
  if(rm){ pollDraft = pollDraft.filter(x => x !== rm); renderPollPop(); }
});
$("#pollCancel").addEventListener("click", () => $("#pollPop").classList.remove("on"));
$("#pollMake").addEventListener("click", () => {
  if(pollDraft.length < 2){ toast("후보를 2곳 이상 골라주세요"); return; }
  if(!db || !currentRoom) return;
  const options = pollDraft.map(id => { const p = places.find(x => x.id === id); return {id, name: p ? p.name : id}; });
  const endsAt = nowMs() + Number($("#pollMin").value) * 60000, ts = firebase.database.ServerValue.TIMESTAMP, id = currentRoom;
  const text = "📊 메뉴 투표: " + options.map(o => o.name).join(" / ");
  ensureAuth().then(() => db.ref("lunchchat/msgs/" + id).push({uid: myId, nick: myNick.slice(0, 20), text: clean(text).slice(0, 300), ts, poll: {options: options.map(o => ({id: o.id, name: o.name.slice(0, 40)})), endsAt}}))
    .then(() => db.ref("lunchchat/rooms/" + id).update({lastAt: ts, lastText: "📊 메뉴 투표", lastNick: myNick, lastUid: myId}))
    .then(() => { pollDraft = []; $("#pollPop").classList.remove("on"); })
    .catch(err => toast("투표 올리기 실패: " + err.message, 4000));
});
// 투표 남은 시간 / 마감 표시 갱신
setInterval(() => { for(const [k, m] of Object.entries(msgData)) if(m.poll && msgEls[k]?.isConnected){ const el = renderMsg(m); msgEls[k].replaceWith(el); msgEls[k] = el; } }, 20000);
$("#emojiPop").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const inp = $("#chatInput"), s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, s) + b.textContent + inp.value.slice(en);
  const pos = s + b.textContent.length; inp.focus(); inp.setSelectionRange(pos, pos);
});
$("#chatMsgs").addEventListener("click", e => {
  const po = e.target.closest(".popt");
  if(po){
    const key = po.closest(".poll").dataset.poll, m = msgData[key]; if(!m) return;
    const i = Number(po.dataset.pi);
    if(nowMs() >= m.poll.endsAt){ const pid = po.dataset.pid; if(places.some(p => p.id === pid)) openPlace(pid, false); return; }
    const room = currentRoom;
    ensureAuth().then(u => {
      const ref = db.ref(`lunchchat/msgs/${room}/${key}/votes/${u.uid}`);
      return (m.votes || {})[u.uid] === i ? ref.remove() : ref.set(i);
    }).catch(err => toast("투표 실패: " + err.message, 4000));
    return;
  }
  const id = e.target.dataset.place; if(!id) return;
  if(places.some(p => p.id === id)) openPlace(id, false); else toast("목록에 없는 가게예요");
});
setInterval(() => { if(view === "rooms" && chatOpen) refreshRooms(); else setBadge(); }, 30000);   // "N분 전" 갱신
// 페이지를 열자마자 연결해서 새 대화가 있는 팀 수를 배지로 보여줌
if(FIREBASE_CONFIG) initFirebase();

/* ───── 점심 / 저녁 전환 ───── */
function applyMeal(){
  const m = MEALS[meal];
  syncMealViews();
  document.body.classList.toggle("dinner", meal === "dinner");
  $("#mealName").textContent = m.name;
  $("#mealHint").textContent = meal === "dinner" ? "☀️ 점심으로" : "🌙 저녁으로";
  document.title = `${m.name} 뭐 먹지?`;
  $("#pick").textContent = "🎲 이 중에서 뽑기";
  // 저녁엔 영업시간을 볼 수 있게 탭 추가
  PICK_TABS = meal === "dinner" ? [...PICK_TABS_BASE, ["hours", "🕖 영업시간", "#home"]] : PICK_TABS_BASE;
  if(!PICK_TABS.some(x => x[0] === pickTab)) pickTab = "menu";
}
$("#budget").addEventListener("click", e => {
  if(e.target.id !== "ceView") return;
  showCE = !showCE; pickedId = null; render(); $("#list").scrollTop = 0;
  if(showCE) toast("7시 전 마감으로 표시된 가게예요. '취소'를 누르면 저녁 목록에 다시 나와요", 3500);
});
let undoTimer = null;
function showUndo(text, fn){
  $("#undoText").textContent = text; $("#undo").classList.add("on");
  $("#undoBtn").onclick = () => { $("#undo").classList.remove("on"); clearTimeout(undoTimer); fn(); };
  clearTimeout(undoTimer); undoTimer = setTimeout(() => $("#undo").classList.remove("on"), 7000);
}
$("#mealToggle").addEventListener("click", () => {
  showCE = false;
  meal = meal === "lunch" ? "dinner" : "lunch";
  applyMeal(); pickedId = null; selected = null;
  if(info){ info.setMap(null); info = null; }
  render();
  toast(`${MEALS[meal].icon} ${MEALS[meal].name} 모드 · 식대 ${MEALS[meal].budget.toLocaleString()}원`);
});
let renderQueued = false;
function renderSoon(){ if(renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 30); }
let gatherDay = null, gatherRef = null;
function watchGather(){
  const day = KST_DAY();
  if(day === gatherDay) return;
  if(gatherRef) gatherRef.off();
  gatherDay = day; gathers = {};
  gatherRef = db.ref("lunchchat/gather/" + day);
  let first = true;
  gatherRef.on("value", s => { gathers = s.val() || {}; renderSoon(); if(first){ first = false; setTimeout(handleGatherLink, 300); } });
}
function watchClosedEarly(){
  if(!initFirebase()) return;
  db.ref("lunchchat/closedEarly").on("value", s => { closedEarly = s.val() || {}; renderSoon(); });
  db.ref("lunchchat/ratings").on("value", s => { ratings = s.val() || {}; renderSoon(); });
  db.ref("lunchchat/visits").on("value", s => { visitsAll = s.val() || {}; syncMealViews(); renderSoon(); });
  db.ref("lunchchat/removed").on("value", s => { removedAll = s.val() || {}; syncMealViews(); renderSoon(); });
  db.ref("lunchchat/menus").on("value", s => { menus = s.val() || {}; renderSoon(); });
  watchGather();
  setInterval(watchGather, 60000);   // 밤 12시가 지나면 새 날짜의 모집으로 자동 전환 (= 초기화)
}
// 브라우저마다 보이지 않는 익명 계정으로 로그인 → 모집 취소를 '모집한 사람 본인'만 할 수 있게 서버가 확인
function ensureAuth(){
  if(!firebase.auth) return Promise.reject(new Error("로그인 모듈 없음"));
  const u = firebase.auth().currentUser;
  return u ? Promise.resolve(u) : firebase.auth().signInAnonymously().then(c => c.user);
}
const authUid = () => (firebase.auth && firebase.auth().currentUser || {}).uid;
/* ── 같이 가요 → 대화방 / 외부 링크 ── */
async function openGatherRoom(gid, g){
  if(!requireNick() || !initFirebase()) return;
  try{ await ensureAuth(); }catch(err){ toast("로그인 실패: " + err.message, 4000); return; }
  if(g.roomId && rooms[g.roomId]){ openChat(); openRoom(g.roomId); return; }   // 이미 있으면 그 방으로
  const day = KST_DAY(), newKey = db.ref("lunchchat/rooms").push().key;
  const name = clean(`${g.time} ${g.placeName} 가는 팟`).slice(0, 40);
  // 동시에 두 사람이 눌러도 방이 하나만 생기게: 먼저 모집에 방 번호를 '찜'하고, 성공한 사람만 방을 만듦
  const tx = await db.ref(`lunchchat/gather/${day}/${gid}/roomId`).transaction(cur => (cur && rooms[cur]) ? undefined : newKey).catch(err => { toast("대화방 만들기 실패: " + err.message, 4000); return null; });
  if(!tx) return;
  const roomId = tx.snapshot.val();
  if(tx.committed && roomId === newKey){
    const T = firebase.database.ServerValue.TIMESTAMP;
    try{ await db.ref("lunchchat/rooms/" + newKey).set({name, createdAt: T, createdBy: myNick.slice(0, 20), lastAt: T, lastText: "", lastNick: "", lastUid: ""}); }
    catch(err){ toast("대화방 만들기 실패: " + err.message, 4000); return; }
    toast(`💬 '${name}' 대화방을 만들었어요`);
  }
  openChat(); openRoom(roomId);
}
function gatherLink(gid){ return `${location.origin}${location.pathname}?g=${KST_DAY()}_${gid}&v=${BUILD}`; }
async function shareGatherLink(gid, g){
  const url = gatherLink(gid), title = `🙋 ${g.time} ${g.placeName} 같이 가요`;
  if(navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)){
    try{ await navigator.share({title, text: title, url}); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(`${title}\n${url}`); toast("링크를 복사했어요. 카톡이나 메신저에 붙여넣으세요", 3500); }
  catch(e){ window.prompt("이 링크를 복사해서 보내세요", url); }
}
// 링크(?g=날짜_모집)로 들어온 경우: 해당 모집으로 이동해서 강조
const linkParam = new URLSearchParams(location.search).get("g");
let hlGather = null, hlUntil = 0;   // 링크로 들어온 모집을 잠깐 강조
let pendingGatherLink = linkParam && /^\d{4}-\d{2}-\d{2}_[-\w]+$/.test(linkParam) ? linkParam.split("_") : null;
if(pendingGatherLink){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }
function handleGatherLink(){
  if(!pendingGatherLink) return;
  const [day, gid] = pendingGatherLink; pendingGatherLink = null;
  if(day !== KST_DAY()){ toast("지난 모집 링크예요 (모집은 밤 12시에 초기화돼요)", 4000); return; }
  const g = gathers[gid];
  if(!g){ toast("이미 끝났거나 취소된 모집이에요", 4000); return; }
  const want = g.meal === "dinner" ? "dinner" : "lunch";
  if(meal !== want){ meal = want; applyMeal(); }
  hlGather = gid; hlUntil = Date.now() + 8000;
  setTimeout(renderSoon, 8100);
  render();
  setTimeout(() => {
    const el = document.querySelector(`.gitem[data-g="${CSS.escape(gid)}"]`);
    if(el) el.scrollIntoView({block: "center"});
    if(window.innerWidth <= 760) $("aside").scrollIntoView({behavior: "smooth"});
  }, 50);
  toast(`🙋 ${g.time} ${clean(g.placeName)} 모집이에요. '나도 갈래요'로 참여하세요`, 5000);
}
async function createGather(p, time){
  if(!requireNick() || !initFirebase()) return;
  let user; try{ user = await ensureAuth(); }catch(err){ toast("로그인 실패: " + err.message, 4000); return; }
  const ref = db.ref("lunchchat/gather/" + KST_DAY()).push();
  ref.set({placeId: p.id, placeName: p.name.slice(0, 60), time, meal, host: myNick.slice(0, 20), hostUid: myId, hostAuth: user.uid,
           createdAt: firebase.database.ServerValue.TIMESTAMP, members: {[user.uid]: myNick}})
    .then(() => { gatherFormOpen = false; render(); $("#list").scrollTop = 0; toast(`🙋 ${time} ${p.name} 모집을 올렸어요 · '🔗 링크'로 초대할 수 있어요`, 3500); })
    .catch(err => toast("모집 실패: " + err.message, 4000));
}
function removeFromPanel(p, btn){
  if(!isAdmin) return;
  if(removedPlaces[p.id]){   // 복구
    db.ref(`lunchchat/removed/${meal}/${p.id}`).remove().then(() => toast(`'${p.name}' 복구했어요`)).catch(err => toast("실패: " + err.message, 4000));
    return;
  }
  if(btn.dataset.armed !== "1"){
    btn.dataset.armed = "1"; btn.textContent = "한 번 더 누르면 삭제";
    setTimeout(() => { if(btn.isConnected && btn.dataset.armed === "1"){ btn.dataset.armed = ""; btn.textContent = "🗑 가게 삭제"; } }, 4000);
    return;
  }
  // 지우기 전에 목록에서 바로 아래 가게를 찾아둠 (맨 끝이면 바로 위)
  const arr = visible(), i = arr.findIndex(x => x.id === p.id);
  const next = arr[i + 1] || arr[i - 1];
  db.ref(`lunchchat/removed/${meal}/${p.id}`).set(true)
    .then(() => {
      toast(`'${p.name}' ${MEALS[meal].name} 목록에서 삭제했어요`, 2500);
      removedPlaces = Object.assign({}, removedPlaces, {[p.id]: true});
      if(next){ pickedId = null; openPlace(next.id, false); } else closePlace();
    })
    .catch(err => toast("삭제 실패: " + err.message, 4000));
}
function addMenu(p){
  if(!isAdmin){ toast("메뉴는 관리자만 넣을 수 있어요"); return; }
  const name = clean(($("#mName").value || "").trim()).slice(0, 30);
  const price = Number(String($("#mPrice").value || "").replace(/[^0-9]/g, ""));
  if(!name){ toast("메뉴 이름을 적어주세요"); $("#mName").focus(); return; }
  if(!price || price > 1000000){ toast("가격을 숫자로 적어주세요 (예: 9000)"); $("#mPrice").focus(); return; }
  db.ref(`lunchchat/menus/${p.id}`).push({name, price, ts: firebase.database.ServerValue.TIMESTAMP})
    .then(() => { $("#mName").value = ""; $("#mPrice").value = ""; $("#mName").focus(); toast(`${name} ${price.toLocaleString()}원 추가`); })
    .catch(err => toast("추가 실패: " + err.message, 4000));
}
function markVisit(p){
  if(!requireNick() || !initFirebase()) return;
  const d = visits[p.id] ? daysAgo(visits[p.id].ts) : null;
  if(d === 0){ toast("오늘 이미 다녀온 걸로 표시돼 있어요"); return; }
  ensureAuth().then(() => db.ref(`lunchchat/visits/${meal}/${p.id}`).set({ts: firebase.database.ServerValue.TIMESTAMP, nick: myNick.slice(0, 20)}))
    .then(() => toast("다녀온 곳으로 기록했어요 · 3일 동안 뽑기에서 빠져요"))
    .catch(err => toast("저장 실패: " + err.message, 4000));
}
async function ratePlace(p, kind){
  if(!requireNick() || !initFirebase()) return;
  let user; try{ user = await ensureAuth(); }catch(err){ toast("로그인 실패: " + err.message, 4000); return; }
  const mine = Object.assign({}, (ratings[p.id] || {})[user.uid] || {});
  const key = meal === "dinner" ? "okDinner" : "okLunch";
  const vk = vKey(), cur = myVote(mine);
  if(meal === "lunch" && mine.v !== undefined){ if(mine.vLunch === undefined) mine.vLunch = mine.v; delete mine.v; }   // 예전 형식 → 점심으로 옮김
  if(kind === "up") mine[vk] = cur === 1 ? 0 : 1;
  if(kind === "down") mine[vk] = cur === -1 ? 0 : -1;
  if(kind === "ok") mine[key] = mine[key] === true ? null : true;
  if(kind === "no") mine[key] = mine[key] === false ? null : false;
  mine.nick = myNick; mine.ts = firebase.database.ServerValue.TIMESTAMP;
  for(const k of ["vLunch", "vDinner"]) if(mine[k] === 0) delete mine[k];
  for(const k of ["okLunch", "okDinner"]) if(mine[k] === null) delete mine[k];
  db.ref(`lunchchat/ratings/${p.id}/${user.uid}`).set(mine).catch(err => toast("저장 실패: " + err.message, 4000));
}
applyMeal();
// 페이지를 켜둔 채로 오후 3시가 되면 저녁으로, 자정이 지나면 점심으로 자동 전환
let lastClockMeal = mealByClock();
setInterval(() => {
  const now = mealByClock();
  if(now === lastClockMeal) return;
  lastClockMeal = now;
  if(meal !== now){
    meal = now; applyMeal(); pickedId = null; selected = null;
    if(info){ info.setMap(null); info = null; }
    render();
    toast(now === "dinner" ? "🌙 오후 3시예요! 저녁 뭐 먹지로 바꿨어요" : "☀️ 점심 뭐 먹지로 바꿨어요", 4000);
  }
}, 30000);

/* ───── 시작 ───── */
render();
initMap();
watchClosedEarly();
$("#welOk").addEventListener("click", welcomeOk);
$("#meBadge").addEventListener("click", () => showWelcome(!!myNick));
$("#welNick").addEventListener("keydown", e => { if(e.key === "Enter") welcomeOk(); });
if(!myNick) showWelcome();   // 처음 들어오면 이름부터
</script>
